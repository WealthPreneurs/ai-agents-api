+PrimaryAssetTypesToScan=(PrimaryAssetType="TFPSWeapon",AssetBaseClass="/Script/TacticalFPS.TFPSWeaponDefinition",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Loadout/Weapons")),Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
+PrimaryAssetTypesToScan=(PrimaryAssetType="TFPSAttachment",AssetBaseClass="/Script/TacticalFPS.TFPSAttachmentDefinition",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Loadout/Attachments")),Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
+PrimaryAssetTypesToScan=(PrimaryAssetType="TFPSPerk",AssetBaseClass="/Script/TacticalFPS.TFPSPerkDefinition",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Loadout/Perks")),Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
+PrimaryAssetTypesToScan=(PrimaryAssetType="TFPSEquipment",AssetBaseClass="/Script/TacticalFPS.TFPSEquipmentDefinition",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Loadout/Equipment")),Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))

